name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The plugin has no dependencies, so there is nothing to install.
      # bash expands the glob on every system: Node 18 does not expand one itself.
      # Tests that need a real browser skip with a message when none is found.
      - name: Run the tests
        shell: bash
        run: node --test tests/*.test.mjs
